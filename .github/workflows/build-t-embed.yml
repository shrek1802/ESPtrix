name: Build ESPTRIX (LILYGO T-Embed CC1101)

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

# Rebuild only the newest development commit, avoiding duplicate long PlatformIO jobs.
concurrency:
  group: esptrix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Test passive signal activity meter (host)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I src tests/signal_meter_test.cpp -o /tmp/esptrix-meter-test
          /tmp/esptrix-meter-test
      - name: Build firmware for LILYGO T-Embed CC1101
        run: pio run -e lilygo-t-embed-cc1101
      - name: Verify complete ESPTRIX factory image and record checksum
        run: |
          test -s ESPTRIX-lilygo-t-embed-cc1101.bin
          sha256sum ESPTRIX-lilygo-t-embed-cc1101.bin > ESPTRIX-SHA256SUMS.txt
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESPTRIX-t-embed-cc1101-development
          path: |
            ESPTRIX-lilygo-t-embed-cc1101.bin
            ESPTRIX-SHA256SUMS.txt
            .pio/build/lilygo-t-embed-cc1101/*.bin
            docs/FLASHING.md
            LICENSE
          if-no-files-found: error
          retention-days: 14
