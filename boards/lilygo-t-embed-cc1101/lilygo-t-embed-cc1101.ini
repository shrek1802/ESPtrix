
[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
; ESPTRIX board-specific workaround: Bruce 1.16.1 and FastLED 3.10 link
; incorrectly under LTO on ESP32-S3 (windowed longcall relocation in
; FastLED consoleWrite). Disable LTO only for this board, pending upstream
; resolution and validated size/performance checks.
build_unflags = -flto
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-fno-lto
	-O2
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=1

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
