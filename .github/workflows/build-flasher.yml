name: Build ESPTRIX Flash Tool (Windows and Linux)

on:
  push:
    branches: [development]
    paths:
      - 'flasher/**'
      - '.github/workflows/build-flasher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esptrix-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux
          - os: windows-2022
            target: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout ESPTRIX
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tk dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libtk8.6 libtcl8.6
      - name: Install desktop build dependencies
        run: python -m pip install --upgrade pip "pyinstaller>=6.12,<7" -r flasher/requirements.txt
      - name: Run source and firmware validation tests
        run: python -m unittest discover -s flasher/tests -v
      - name: Compile standalone GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all esptool --collect-all serial --name ESPTRIX-Flasher flasher/app.py
      - name: Upload executable for download
        uses: actions/upload-artifact@v4
        with:
          name: ESPTRIX-Flasher-${{ matrix.target }}
          path: |
            dist/ESPTRIX-Flasher
            dist/ESPTRIX-Flasher.exe
          if-no-files-found: error
          retention-days: 14
